<style>
/* CSS خفيف بأسلوب Tailwind (بدون CDN ليعمل دون إنترنت) */
:root{--bg:#0f172a;--card:#1e293b;--ac:#f59e0b;--ac2:#22d3ee;--tx:#f1f5f9;--mu:#94a3b8}
*{box-sizing:border-box;margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:480px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:18px;padding:14px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.col{display:flex;flex-direction:column;gap:8px}
.c1{flex:1;text-align:center;font-weight:700;font-size:18px}
.tc{text-align:center}.mu{color:var(--mu)}.sm{font-size:13px}.big{font-size:56px}.sp{letter-spacing:4px}
.btn{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border:0;border-radius:16px;padding:14px;font-size:17px;font-weight:700;width:100%}
.btn:active{transform:scale(.97)}.b2{background:linear-gradient(135deg,#06b6d4,#6366f1)}.b3{background:#334155}
.inp{width:100%;padding:12px;border-radius:12px;border:2px solid #334155;background:#0b1220;color:var(--tx);font-size:16px}
.av{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.av b{font-size:28px;padding:6px;border-radius:12px;background:var(--card);border:2px solid transparent;text-align:center}.av b.on{border-color:var(--ac)}
.av1{font-size:38px}
.opt{padding:14px;border-radius:14px;border:2px solid #334155;background:var(--card);color:var(--tx);font-size:17px}
.opt.sel{border-color:var(--ac2)}.opt.ok{background:#166534;border-color:#22c55e}.opt.bad{background:#7f1d1d;border-color:#ef4444}
.sb{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--card);border-radius:20px;padding:5px 10px;font-size:14px}
.me{outline:2px solid var(--ac)}
.cv{width:100%;aspect-ratio:1;background:#fff;border-radius:14px;touch-action:none;display:block}
.pal{display:flex;gap:8px;justify-content:center;margin-top:8px}.pal i{width:30px;height:30px;border-radius:50%;border:2px solid #fff;font-style:normal;text-align:center}
.gb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:12px;border:0;background:#1e293b;font-size:28px;color:#fff}
.ip{font-size:24px;font-weight:800;color:var(--ac2);direction:ltr;margin:8px 0}
.chat{font-size:14px;min-height:60px}.g1{color:#4ade80}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}textarea.inp{resize:vertical;font-size:14px}
.tm{background:var(--card);padding:4px 12px;border-radius:20px}
button:disabled{opacity:.65}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style></head>

 return `<div class="card tc mu">جولة ${S.ri+1} / ${S.n}</div><button class="btn" style="height:220px;font-size:28px;background:${g?'#16a34a':w?'#b91c1c':'#334155'}" ${d||S.ph==='r'?'disabled':''} onpointerdown="act({t:'k'})">${S.ph==='r'?'النتائج':d?'تم':g?'اضغط الآن!!':'انتظر… لا تضغط'}</button><div class="chat">${S.rs.map(x=>{const p=S.pl[x.id];return `<div>${p?p.a+' '+esc(p.n):''}: ${x.ms<0?'❌ تسرّع':x.ms+' ms'}</div>`}).join('')}</div>`}

/* ---------- تطبيق الحالة على الجهاز (مكافآت/طاقة/عرض) ---------- */
function apply(){
 const rk=S.gid+'-'+(S.i!=null?S.i:S.ri);if(rk!==lastRk){lastRk=rk;my=-1;cx.clearRect(0,0,320,320)}
 if(S.ph!=='lobby'&&S.gid&&lastGid!==S.gid){lastGid=S.gid;if(P.en===5)P.enT=Date.now();P.en=Math.max(0,P.en-1);sv()}
 if(S.ph==='end'&&lastRew!==S.gid){lastRew=S.gid;const sc=(S.pl[myId]||{}).sc||0,top=sc>0&&Object.values(S.pl).every(p=>p.sc<=sc);
  RW=5+Math.round(sc/(S.g==='grid'?1:20))+(top?20:0);P.co+=RW;P.g++;if(top)P.w++;sv()}
 const k=JSON.stringify(Object.assign({},S,{tl:0}));
 if(k===lastK){const t=$('#tm');if(t)t.textContent=S.tl;return}
 lastK=k;render()}
render();
</script></body></html>
