name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm i -g cordova
      - name: Build
        run: |
          cordova create app com.friends.party "PartyGame"
          cp index.html app/www/index.html
          cd app
          sed -i 's#<widget #<widget xmlns:android="http://schemas.android.com/apk/res/android" #' config.xml
          sed -i 's#</widget>#<preference name="scheme" value="http" /><platform name="android"><edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application"><application android:usesCleartextTraffic="true" /></edit-config></platform></widget>#' config.xml
          cordova platform add android
          cordova plugin add cordova-plugin-websocket-server
          cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: PartyGame-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
